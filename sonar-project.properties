# sonar-project.properties
# Documenta la configuracion del analisis. Ojo: el plugin de Maven (mvn sonar:sonar) no lee este archivo;
# los mismos valores estan declarados en el pom.xml (<properties>), que es lo que se usa en la practica.

# Identificacion del proyecto en SonarQube / SonarCloud
sonar.projectKey=com.universidad:envios-service
sonar.projectName=Envios Service
# Version 2.0: analisis posterior al refactor con patron Strategy
sonar.projectVersion=2.0

# Rutas del codigo fuente, de las pruebas y de los binarios compilados
sonar.sources=src/main/java
sonar.tests=src/test/java
sonar.java.binaries=target/classes

# Reporte de cobertura generado por JaCoCo (mvn clean verify)
sonar.coverage.jacoco.xmlReportPaths=target/site/jacoco/jacoco.xml

# Servidor: SonarQube local con Docker. Con SonarCloud: sonar.host.url=https://sonarcloud.io
# y agregar sonar.organization=<tu-organizacion>
sonar.host.url=http://localhost:9000

# No bloquear la construccion esperando el resultado del Quality Gate
sonar.qualitygate.wait=false

# Sin sonar.exclusions: el proyecto no tiene clases de arranque (Main) ni codigo generado
# que distorsione la cobertura, asi que todo el codigo de negocio se analiza.
